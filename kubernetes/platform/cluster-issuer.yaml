# cert-manager ClusterIssuer backed by the Vault intermediate CA.
# cert-manager generates the key and CSR itself, so it uses pki/sign (not pki/issue).
# The Vault role needs use_csr_common_name=true, use_csr_sans=true, require_cn=false.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer
spec:
  vault:
    path: pki/sign/homelab
    server: https://vault.homelab.example:8200
    caBundle: <BASE64_FULL_CA_CHAIN>
    auth:
      appRole:
        path: approle
        roleId: <CERT_MANAGER_ROLE_ID>
        secretRef:
          name: cert-manager-vault-approle
          key: secretId
